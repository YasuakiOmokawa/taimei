volumes:
  pg-data:

# 共有ネットワーク `taimei-network` は taimei-auth (sibling compose) が作成主 (define)。
# taimei 側は external 参照のみ。先に `cd ../taimei-auth && docker compose up --build` で
# network と auth-service を起動しておくこと。
# - app.taimei-code.local → application (taimei, port 3001)         ← 本 compose で alias 付与
# - auth.taimei-code.local → auth-service (taimei-auth, port 3100)  ← taimei-auth 側で alias 付与
# Cookie domain (.taimei-code.local) を共有し cross-subdomain SSO を成立させる。
networks:
  taimei-network:
    name: taimei-network
    external: true

services:
  # taimei (Next.js) 用 DB
  postgres:
    image: postgres:16.8-alpine3.21
    volumes:
      - pg-data:/var/lib/postgresql/data
      - type: bind
        source: "./dump"
        target: "/dump"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DATABASE=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_ROOT_PASSWORD=root
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - taimei-network

  # vitest 用 DB (dbEffect / withRollback で利用)
  test_db:
    image: postgres:16.8-alpine3.21
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=taimei_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: pg_isready -U postgres -d taimei_test
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - taimei-network

  # taimei (Next.js dev server) — taimei-auth (sibling compose) の auth-service に依存。
  # 別 compose のため depends_on で起動順を担保できない。先に taimei-auth 側 compose を起動すること。
  application:
    build:
      context: '.'
      dockerfile: Dockerfile
      args:
        NPM_TOKEN: ${NPM_TOKEN}
        NEXT_PUBLIC_APP_URL: http://app.taimei-code.local:3001
        NEXT_PUBLIC_AUTH_URL: http://auth.taimei-code.local:3100
        # APP_BUILD_CMD="" で Dockerfile の RUN ${APP_BUILD_CMD} を skip する。
        # next dev (turbopack) が runtime コンパイルするため build 段階は不要。
        APP_BUILD_CMD: ""
    ports:
      - "3001:3001"
    command: >
      sh -c "bunx drizzle-kit migrate && bun dev"
    user: vscode
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/postgres
      - APP_ENV=development
      - PORT=3001
      - NEXT_PUBLIC_APP_URL=http://app.taimei-code.local:3001
      - NEXT_PUBLIC_AUTH_URL=http://auth.taimei-code.local:3100
      - AUTH_SERVICE_URL=http://auth.taimei-code.local:3100
      - AUTH_TRUSTED_ORIGINS=http://app.taimei-code.local:3001,http://auth.taimei-code.local:3100
      - AUTH_COOKIE_DOMAIN=taimei-code.local
      # taimei-auth (auth-service) と Cookie 署名検証を一致させるため、両 compose で同じ dev secret を hardcoded。
      # 本番はこの環境変数を docker-compose 経由ではなくホスト側の secret manager 等で注入すること。
      - AUTH_SECRET=dev-secret-for-local-development-32chars
      # taimei → auth-service の ConnectRPC (verifySession 等) で送信する X-Service-Key。
      # taimei-auth 側の AUTH_SERVICE_KEY と一致必須。一致しないと session 検証が落ち、
      # after-signin page が getSession()===null を観測して signin_failed に飛ぶ症状になる。
      - AUTH_SERVICE_KEY=local-dev-key
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: ./package.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      taimei-network:
        aliases:
          - app.taimei-code.local
