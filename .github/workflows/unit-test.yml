name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # taimei-network は dev では taimei-auth (sibling compose) が作成主だが、CI test job では
      # taimei 単独実行のため事前に作成する。`|| true` は CI runner が再利用された際の重複防止。
      - name: Create shared network
        run: docker network create taimei-network || true

      - name: Start test database
        run: docker compose up -d test_db --wait

      - name: Run all tests
        run: bun run test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5434/taimei_test

      - name: Stop test database
        if: always()
        run: docker compose stop test_db
