name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fallow audit が origin/main との merge-base を必要とする

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # audit:high は GHSA-vfj7-8cjw-p6xm (braces の DoS) を無視する。修正版が無く、braces は tailwindcss の glob 展開だけで使う。braces の修正版が出たら外す
      # GHSA-68fv-2mgg-jv7q (source-map-js の DoS) の修正版 1.2.2 は minimumReleaseAge の窓を 2026-10-07 23:08 JST に抜ける。overrides で 1.2.2 に上げたら外す
      - name: Security audit
        run: bun run audit:high

      - name: Biome + fallow audit
        run: bun run lint

      - name: Type check
        run: bun run typecheck
