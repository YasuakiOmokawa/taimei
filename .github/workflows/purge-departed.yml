name: Purge Departed
on:
  # GitHub の schedule は遅れや取りこぼしがあり、公開リポジトリは 60 日 commit が無いと止まる。取りこぼしは次の回が拾う
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: purge-departed

jobs:
  purge-departed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call purge-departed
        run: >
          curl --fail-with-body --silent --show-error --max-time 300
          -H "Authorization: Bearer ${CRON_SECRET}"
          https://app.taimei-code.com/api/cron/purge-departed
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
