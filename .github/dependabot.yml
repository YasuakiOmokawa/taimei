version: 2

registries:
  taimei-code-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_NPM_TOKEN}}

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # bunfig.toml の minimumReleaseAge と minimumReleaseAgeExcludes を Dependabot は読まない
    cooldown:
      default-days: 7
      exclude:
        - "@taimei-code/auth-client"
    registries:
      - taimei-code-npm
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
